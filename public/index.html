<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Smart Parking - Login / Register</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body data-page="login">
<header class="navbar">
    <div class="nav-brand">IoT Smart Parking</div>
</header>

<main class="auth-wrapper">
    <div class="auth-card">
        <div class="auth-toggle">
            <button id="showLogin" class="toggle-btn active">Login</button>
            <button id="showRegister" class="toggle-btn">Register</button>
        </div>

        <div id="loginSection" class="auth-section active">
            <h2>Welcome Back</h2>
            <p class="subtitle">Login to manage your parking</p>
            <div id="loginMessage" class="form-message"></div>
            <form id="loginForm" class="form">
                <div class="form-group">
                    <label for="loginEmail">Email</label>
                    <input type="email" id="loginEmail" placeholder="you@example.com" required>
                </div>
                <div class="form-group">
                    <label for="loginPassword">Password</label>
                    <input type="password" id="loginPassword" placeholder="••••••••" required>
                </div>
                <button type="submit" id="loginBtn" class="btn btn-primary full-width">Login</button>
            </form>
        </div>

        <div id="registerSection" class="auth-section">
            <h2>Create Account</h2>
            <p class="subtitle">Sign up to start booking slots</p>
            <div id="registerMessage" class="form-message"></div>
            <form id="registerForm" class="form">
                <div class="form-group">
                    <label for="regName">Full Name</label>
                    <input type="text" id="regName" placeholder="Your name" required>
                </div>
                <div class="form-group">
                    <label for="regMobile">Mobile Number</label>
                    <input type="tel" id="regMobile" placeholder="10-digit mobile" required>
                </div>
                <div class="form-group">
                    <label for="regEmail">Email</label>
                    <input type="email" id="regEmail" placeholder="you@example.com" required>
                </div>
                <div class="form-group">
                    <label for="regPassword">Password</label>
                    <input type="password" id="regPassword" placeholder="Create a password" required>
                </div>
                <button type="submit" id="registerBtn" class="btn btn-primary full-width">Register</button>
            </form>
        </div>
    </div>
</main>

<script src="db.js"></script>
<script src="app.js"></script>
</body>
</html>
